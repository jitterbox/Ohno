name: Release

# Pushing a v* tag is the whole release: this builds a VSIX per
# platform, pulls that version's section out of CHANGELOG.md for the
# release notes, and publishes the release with the packages attached.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.3)'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: VSIX (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            vsce_target: linux-x64
            binary: ComplexityAnalyzer.Server
          - rid: win-x64
            vsce_target: win32-x64
            binary: ComplexityAnalyzer.Server.exe
          - rid: osx-arm64
            vsce_target: darwin-arm64
            binary: ComplexityAnalyzer.Server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/extension/package-lock.json
      - name: Publish analyzer
        working-directory: src/analyzer
        run: >
          dotnet publish ComplexityAnalyzer.Server
          -c Release -r ${{ matrix.rid }} --self-contained
          -o ../extension/server
      - name: Verify server
        run: test -f src/extension/server/${{ matrix.binary }}
      - name: Package VSIX
        working-directory: src/extension
        run: |
          npm ci
          npx --yes @vscode/vsce package \
            --target ${{ matrix.vsce_target }} \
            --no-rewrite-relative-links \
            --allow-missing-repository
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ohno-${{ matrix.rid }}
          path: src/extension/*.vsix
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect VSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: ohno-*
          path: packages
          merge-multiple: true

      # The changelog is the source of truth for what shipped, so the
      # release notes are read from it rather than written twice.
      - name: Extract release notes
        id: notes
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Ohno ${{ steps.notes.outputs.version || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: packages/*.vsix
          fail_on_unmatched_files: true
