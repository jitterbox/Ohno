name: Release

# Two ways in:
#
#   * push a v* tag — the normal path for a new version
#   * run this workflow manually — creates the tag as well, which is
#     how the retroactive 0.1.0–0.1.2 tags were made
#
# Either way the release notes come out of CHANGELOG.md rather than
# being written twice, so they cannot drift from it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, created if it does not exist (e.g. v0.1.3)'
        required: true
      target:
        description: 'Commit SHA or branch the tag should point at'
        required: true
        default: master
      build:
        description: 'Build and attach VSIX packages'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: VSIX (${{ matrix.rid }})
    # Older versions were built against a different SDK, so a
    # retroactive tag is published without packages rather than
    # pretending this toolchain can produce them.
    if: github.event_name != 'workflow_dispatch' || inputs.build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            vsce_target: linux-x64
            binary: ComplexityAnalyzer.Server
          - rid: win-x64
            vsce_target: win32-x64
            binary: ComplexityAnalyzer.Server.exe
          - rid: osx-arm64
            vsce_target: darwin-arm64
            binary: ComplexityAnalyzer.Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/extension/package-lock.json
      - name: Publish analyzer
        working-directory: src/analyzer
        run: >
          dotnet publish ComplexityAnalyzer.Server
          -c Release -r ${{ matrix.rid }} --self-contained
          -o ../extension/server
      - name: Verify server
        run: test -f src/extension/server/${{ matrix.binary }}
      - name: Package VSIX
        working-directory: src/extension
        run: |
          npm ci
          npx --yes @vscode/vsce package \
            --target ${{ matrix.vsce_target }} \
            --no-rewrite-relative-links \
            --allow-missing-repository
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ohno-${{ matrix.rid }}
          path: src/extension/*.vsix
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: always() && needs.package.result != 'failure' && needs.package.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      # Checks out the triggering ref, which always carries the
      # changelog: the tag itself on a push, or the default branch on a
      # manual run. A retroactive tag points at a commit from before
      # the changelog existed, so its notes have to be read from here.
      - uses: actions/checkout@v4

      - name: Collect VSIX packages
        if: needs.package.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: ohno-*
          path: packages
          merge-multiple: true

      - name: Extract release notes
        id: notes
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ inputs.target || github.sha }}
          name: Ohno ${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: ${{ needs.package.result == 'success' && 'packages/*.vsix' || '' }}
          fail_on_unmatched_files: ${{ needs.package.result == 'success' }}
